<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spaceship Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #080b10;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-container {
      position: relative;
      width: 320px;
      height: 480px;
    }
    canvas {
      width: 100%;
      height: 100%;
      background: #020408;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      display: block;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 11, 16, 0.94);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 16px;
      overflow-y: auto;
    }
    .hidden {
      display: none !important;
    }
    h2 {
      color: #00ffcc;
      font-size: 20px;
      margin-bottom: 2px;
    }
    .coins-text {
      color: #ffff00;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .level-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
      max-height: 240px;
      overflow-y: auto;
    }
    .lvl-btn {
      padding: 8px 0;
      background: #1a2634;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    .lvl-btn:active {
      background: #00ffcc;
      color: #000;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #1a2634;
      color: #fff;
      border: 1px solid #00ffcc;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:active {
      background: #00ffcc;
      color: #000;
    }
    .btn-orange {
      border-color: #ff9900;
      color: #ff9900;
    }
    .btn-orange:active {
      background: #ff9900;
      color: #000;
    }

    .shop-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    /* Нижняя панель управления */
    .controls {
      width: 320px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .row {
      display: flex;
      gap: 6px;
    }
    .ctrl-btn {
      flex: 1;
      padding: 12px;
      background: #121924;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      background: #00ffcc;
      color: #000;
    }
    .btn-fire {
      border-color: #ff0055;
      color: #ff0055;
    }
    .btn-fire:active {
      background: #ff0055;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <canvas id="gameCanvas" width="320" height="480"></canvas>

    <!-- Главное меню с выборкой из 20 уровней -->
    <div id="menuScreen" class="screen">
      <h2>SPACE ARCADE</h2>
      <div id="menuCoins" class="coins-text">Монеты: $0</div>
      <button class="btn btn-orange" onclick="window.gameEngine.openShop()" style="margin-bottom: 6px;">🛒 МАГАЗИН</button>
      <p style="font-size: 12px; color: #aaa;">Выберите уровень (1–20):</p>
      <div class="level-grid" id="levelGrid"></div>
    </div>

    <!-- Расширенный Магазин -->
    <div id="shopScreen" class="screen hidden">
      <h2 style="color: #ff9900;">МАГАЗИН</h2>
      <div id="shopCoins" class="coins-text">Баланс: $0</div>
      <div class="shop-list">
        <button id="shopGunBtn" class="btn">🔫 Пушка - $30</button>
        <button id="shopShieldBtn" class="btn">🛡️ Щит - $20</button>
        <button id="shopSpeedBtn" class="btn">⚡ Двигатель (Скорость) - $25</button>
        <button id="shopHpBtn" class="btn">❤️ Доп. Жизнь - $40</button>
        <button id="shopMagnetBtn" class="btn">🧲 Магнит монет - $50</button>
      </div>
      <button class="btn" style="margin-top: 10px;" onclick="window.gameEngine.openMenu()">◀ В МЕНЮ</button>
    </div>

    <!-- Экран Game Over -->
    <div id="gameOverScreen" class="screen hidden" style="justify-content: center;">
      <h2 style="color: #ff0055;">ИГРА ОКОНЧЕНА</h2>
      <div id="finalScore" style="font-size: 16px; margin-top: 8px;">Счет: 0</div>
      <div id="finalCoins" style="font-size: 14px; color: #ffff00; margin-top: 4px;">Собрано монет: $0</div>
      <button class="btn" style="margin-top: 20px; width: 160px;" onclick="window.gameEngine.openMenu()">В МЕНЮ</button>
    </div>
  </div>

  <!-- Панель управления -->
  <div class="controls">
    <div class="row">
      <button id="btnLeft" class="ctrl-btn">◀</button>
      <button id="btnRight" class="ctrl-btn">▶</button>
      <button id="btnFire" class="ctrl-btn btn-fire">🔥 АТАКА</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
