<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spaceship Game Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #080b10;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-container {
      position: relative;
      width: 320px;
      height: 480px;
    }
    canvas {
      width: 100%;
      height: 100%;
      background: #020408;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      display: block;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 11, 16, 0.95);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 14px;
      overflow-y: auto;
    }
    .hidden {
      display: none !important;
    }
    h2 {
      color: #00ffcc;
      font-size: 20px;
      margin-bottom: 2px;
    }
    .coins-text {
      color: #ffff00;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .mode-select {
      display: flex;
      gap: 4px;
      width: 100%;
      margin-bottom: 4px;
    }
    .mode-btn {
      flex: 1;
      padding: 6px 2px;
      font-size: 10px;
      background: #121924;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #00ffcc;
      color: #000;
    }
    .level-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
      max-height: 160px;
      overflow-y: auto;
    }
    .lvl-btn {
      padding: 8px 0;
      background: #1a2634;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }
    .lvl-btn:active {
      background: #00ffcc;
      color: #000;
    }
    .btn {
      width: 100%;
      padding: 9px;
      background: #1a2634;
      color: #fff;
      border: 1px solid #00ffcc;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:active {
      background: #00ffcc;
      color: #000;
    }
    .btn-orange {
      border-color: #ff9900;
      color: #ff9900;
    }
    .btn-purple {
      border-color: #aa00ff;
      color: #aa00ff;
    }

    .quest-item {
      width: 100%;
      background: #121924;
      border: 1px solid #334455;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quest-item.completed {
      border-color: #00ffcc;
      background: #002b22;
    }

    /* Уведомление о прохождении уровня */
    .level-clear-overlay {
      position: absolute;
      top: 30%;
      left: 10%;
      width: 80%;
      background: rgba(0, 255, 204, 0.95);
      color: #000;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 0 20px #00ffcc;
    }

    /* Панель управления */
    .controls {
      width: 320px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .row {
      display: flex;
      gap: 6px;
    }
    .ctrl-btn {
      flex: 1;
      padding: 12px;
      background: #121924;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      background: #00ffcc;
      color: #000;
    }
    .btn-fire {
      border-color: #ff0055;
      color: #ff0055;
    }
    .btn-fire:active {
      background: #ff0055;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <canvas id="gameCanvas" width="320" height="480"></canvas>

    <!-- Оверлей перехода на следующий уровень -->
    <div id="levelClearOverlay" class="level-clear-overlay hidden">
      <h3 style="font-size: 18px;">УРОВЕНЬ ПРОЙДЕН!</h3>
      <p id="levelClearText" style="font-size: 12px; margin: 8px 0;">Следующий уровень через 2 сек...</p>
      <button class="btn" style="background:#000; color:#00ffcc; border:none;" onclick="window.gameEngine.nextLevel()">ДАЛЕЕ ▶</button>
    </div>

    <!-- Главное меню -->
    <div id="menuScreen" class="screen">
      <h2>SPACE ARCADE</h2>
      <div id="menuCoins" class="coins-text">Монеты: $0</div>

      <div class="mode-select">
        <button id="modeCampaign" class="mode-btn active" onclick="window.gameEngine.setMode('CAMPAIGN')">Кампания</button>
        <button id="modeEndless" class="mode-btn" onclick="window.gameEngine.setMode('ENDLESS')">Бесконечный</button>
        <button id="modeBossRun" class="mode-btn" onclick="window.gameEngine.setMode('BOSSRUN')">Босс-Ран</button>
      </div>

      <div style="display: flex; gap: 6px; width: 100%; margin-bottom: 4px;">
        <button class="btn btn-orange" onclick="window.gameEngine.openShop()">🛒 Магазин</button>
        <button class="btn btn-purple" onclick="window.gameEngine.openQuests()">📜 Квесты</button>
      </div>

      <p id="lvlSelectTitle" style="font-size: 11px; color: #aaa;">Выберите стартовый уровень:</p>
      <div class="level-grid" id="levelGrid"></div>
    </div>

    <!-- Магазин -->
    <div id="shopScreen" class="screen hidden">
      <h2 style="color: #ff9900;">МАГАЗИН</h2>
      <div id="shopCoins" class="coins-text">Баланс: $0</div>
      <div style="display:flex; flex-direction:column; gap:6px; width:100%;">
        <button id="shopGunBtn" class="btn">🔫 Пушка - $30</button>
        <button id="shopShieldBtn" class="btn">🛡️ Щит - $20</button>
        <button id="shopSpeedBtn" class="btn">⚡ Двигатель - $25</button>
        <button id="shopHpBtn" class="btn">❤️ Доп. Жизнь - $40</button>
      </div>
      <button class="btn" style="margin-top: auto;" onclick="window.gameEngine.openMenu()">◀ В МЕНЮ</button>
    </div>

    <!-- Окно Квестов -->
    <div id="questsScreen" class="screen hidden">
      <h2 style="color: #aa00ff;">КВЕСТЫ</h2>
      <div id="questList" style="display:flex; flex-direction:column; gap:6px; width:100%; margin-top:8px;"></div>
      <button class="btn" style="margin-top: auto;" onclick="window.gameEngine.openMenu()">◀ В МЕНЮ</button>
    </div>

    <!-- Экран Game Over -->
    <div id="gameOverScreen" class="screen hidden" style="justify-content: center;">
      <h2 style="color: #ff0055;">ИГРА ОКОНЧЕНА</h2>
      <div id="finalScore" style="font-size: 16px; margin-top: 8px;">Счет: 0</div>
      <div id="finalCoins" style="font-size: 14px; color: #ffff00; margin-top: 4px;">Баланс монет: $0</div>
      <button class="btn" style="margin-top: 20px; width: 160px;" onclick="window.gameEngine.openMenu()">В МЕНЮ</button>
    </div>
  </div>

  <!-- Панель управления -->
  <div class="controls">
    <div class="row">
      <button id="btnLeft" class="ctrl-btn">◀</button>
      <button id="btnRight" class="ctrl-btn">▶</button>
      <button id="btnFire" class="ctrl-btn btn-fire">🔥 АТАКА</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
